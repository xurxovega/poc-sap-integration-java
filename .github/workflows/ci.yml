# CI minimo (plan de accion Fase 2, auditoria B7/T12): sin esto, cuatro tests
# vivieron 53 dias sin ejecutarse y nadie lo supo.
#
# - build: unit + slice + ArchUnit + contract (WireMock) + JaCoCo. Sin Docker.
# - e2e-docker: las IT gateadas por -Ddocker.available=true (Testcontainers).
#   Separado para que un runner sin Docker siga dando senal.
name: ci

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Verify (unit, slice, ArchUnit, contract, JaCoCo)
        run: mvn -B -ntp verify
      - name: Subir informes JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/**"
          if-no-files-found: ignore

  e2e-docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: IT con Testcontainers (Mongo real, smoke de infraestructura)
        run: mvn -B -ntp -pl it -am verify -DskipTests=false -Ddocker.available=true
