server:
  port: ${ARTICLE_SERVER_PORT:8082}

spring:
  application:
    name: article-app
  config:
    import: "application-common.yml"
  datasource:
    # Sin defaults de credenciales en el YAML empaquetado (auditoria A8): usuario
    # y clave vienen SIEMPRE del entorno (scripts/env/local.env en local).
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/poc}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  # Boot 4 movio las propiedades de conexion a spring.mongodb.*; las de Spring
  # Data (auto-index-creation) siguen en spring.data.mongodb.* (application-common.yml).
  mongodb:
    uri: ${MONGO_URL_ARTICLE:${MONGO_URL:mongodb://localhost:27017/article}}
  elasticsearch:
    uris: ${ES_URL:http://localhost:9200}
  kafka:
    bootstrap-servers: ${MESSAGING_BOOTSTRAP:localhost:19092}
    consumer:
      group-id: article-consumer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

article:
  kafka:
    topic: outbox.ARTICLE
    group: article-consumer
    # Hilos de consumo por instancia (ADR-0011). particiones >= instancias x concurrency.
    concurrency: ${ARTICLE_KAFKA_CONCURRENCY:3}

sap:
  article:
    s4:
      path: /sap/opu/odata/sap/API_PRODUCT