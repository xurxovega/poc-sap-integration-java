apiVersion: apps/v1
kind: Deployment
metadata:
  name: article-app
  labels:
    app.kubernetes.io/name: article-app
    app.kubernetes.io/part-of: sap-integration
spec:
  replicas: 2   # alta disponibilidad: el estado usa version optimista (ADR-0002)
  selector:
    matchLabels:
      app.kubernetes.io/name: article-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: article-app
        app.kubernetes.io/part-of: sap-integration
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      serviceAccountName: sap-integration
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 45   # > spring.lifecycle.timeout-per-shutdown-phase (30s)
      containers:
        - name: app
          image: REGISTRY/poc-sap/article:0.1.0-SNAPSHOT   # la fija cada overlay (images:)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: sap-integration-config      # valores comunes no secretos
            - configMapRef:
                name: article-config              # valores propios del dominio
            - secretRef:
                name: sap-integration-secrets     # credenciales SAP/Keycloak (externo: sealed-secrets, ESO, vault...)
            - secretRef:
                name: article-secrets             # credenciales del legacy de este dominio
          env:
            - name: ARTICLE_SERVER_PORT
              value: "8082"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:+UseZGC"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36        # hasta 3 min: la app espera al legacy (ddl-auto validate)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # buildpacks escriben en /tmp
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: article-app
  labels:
    app.kubernetes.io/name: article-app
spec:
  selector:
    app.kubernetes.io/name: article-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: article-config
data:
  MONGO_URL_ARTICLE: "mongodb://mongodb.data.svc:27017/article"
  POSTGRES_URL: "jdbc:postgresql://postgres.legacy.svc:5432/poc"
