openapi: 3.0.0
info: {title: Fixed Asset - Master Data, version: 1.1.0, description: 'The service contains the nodes required to maintain an asset master record, including the following nodes: account assignment, ledger, valuation, time-based valuation information.'}
externalDocs: {description: Business Documentation, url: 'https://help.sap.com/http.svc/ahp2/SAP_S4HANA_CLOUD/2608.latest/EN/e5/28a94c467943149133b62f12a17e11/frameset.htm'}
