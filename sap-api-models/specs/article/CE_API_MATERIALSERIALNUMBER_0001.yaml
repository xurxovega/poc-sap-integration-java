openapi: 3.0.0
info:
  title: Material Serial Number
  version: 1.2.0
  description: |-
    This service contains information about material serial numbers and partner functions. The information is sent in the request as a payload.

    All the information in the payload is used to create or update the material serial number and includes appropriate checks for restricted values and authorizations. Once the material serial number has been created, the material serial number is sent in the response along with the related data.

    If the input in the request is not as expected when you create or update a material serial number, the system displays appropriate error or warning messages in the response.
