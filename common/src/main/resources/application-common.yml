# Configuracion comun SAP y observabilidad (TECH.md §8, §9)
# Cada dominio sobreescribe lo que necesite en su application.yml.

app:
  notifications:
    # Alertas de sincronizacion parcial (ADR-0010): ademas del WARN en el log, un
    # mensaje JSON por entidad en este topic para quien tenga que actuar.
    topic: ${SYNC_ALERTS_TOPIC:sap.sync.alerts}
    kafka:
      enabled: ${SYNC_ALERTS_KAFKA_ENABLED:true}
  security:
    # true (por defecto): las APIs exigen un JWT de Keycloak y cada endpoint declara
    # con @PreAuthorize quien puede llamarlo. false: todo abierto, solo para el
    # entorno local con el SAP simulado (scripts/env/local.env).
    enabled: ${APP_SECURITY_ENABLED:true}
    keycloak:
      # Cliente de Keycloak cuyos roles de cliente (resource_access.<client>.roles)
      # se suman a los del realm.
      client-id: ${KEYCLOAK_CLIENT_ID:sap-integration}

sap:
  odata:
    address:
      enabled: ${SAP_ODATA_ADDRESS_ENABLED:false}
    fiscal:
      enabled: ${SAP_ODATA_FISCAL_ENABLED:false}
    contact:
      enabled: ${SAP_ODATA_CONTACT_ENABLED:false}
    banking:
      enabled: ${SAP_ODATA_BANKING_ENABLED:false}
    customer:
      enabled: ${SAP_ODATA_CUSTOMER_ENABLED:false}
    read:
      enabled: ${SAP_ODATA_READ_ENABLED:false}
    address-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartnerAddress
    fiscal-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartnerTaxNumber
    contact-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartnerContact
    banking-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartnerBank
    customer-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartner
    bp-path: /sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartner
    mandate-path: /sap/opu/odata/sap/API_APAR_SEPA_MANDATE_SRV/SEPAMandateSet
  sepa:
    # Identificador de acreedor SEPA de la empresa: clave del mandato en S/4
    # (SEPAMandateSet(Creditor, SEPAMandate)). Sin el, el adaptador de mandatos
    # falla con un mensaje claro en la primera llamada.
    creditor-id: ${SAP_SEPA_CREDITOR_ID:}
    application: ${SAP_SEPA_APPLICATION:F}
  auth:
    # false (por defecto): sin credenciales SAP la app NO arranca. true: token
    # stub con aviso en el log; solo para el SAP simulado (scripts/env/local.env).
    allow-stub: ${SAP_AUTH_ALLOW_STUB:false}
  btp:
    base-url: ${SAP_BTP_BASE_URL:https://default-tenant.example.eu10.xsuaa.hana.ondemand.com}
    xsuaa:
      client-id: ${SAP_BTP_CLIENT_ID:}
      client-secret: ${SAP_BTP_CLIENT_SECRET:}
      token-url: ${SAP_BTP_TOKEN_URL:}
  s4:
    base-url: ${SAP_S4_BASE_URL:https://my12345-api.s4hana.cloud.sap}
    csrf:
      enabled: ${SAP_S4_CSRF_ENABLED:false}
      fetch-path: ${SAP_S4_CSRF_FETCH_PATH:/sap/opu/odata/sap/API_BUSINESS_PARTNER/A_BusinessPartner}
    auth:
      type: ${SAP_S4_AUTH_TYPE:oauth2}
      token-url: ${SAP_S4_TOKEN_URL:}
      client-id: ${SAP_S4_CLIENT_ID:}
      client-secret: ${SAP_S4_CLIENT_SECRET:}
      username: ${SAP_S4_USERNAME:}
      password: ${SAP_S4_PASSWORD:}
  client:
    connect-timeout-ms: ${SAP_CLIENT_CONNECT_TIMEOUT_MS:3000}
    response-timeout-ms: ${SAP_CLIENT_RESPONSE_TIMEOUT_MS:20000}
    # Llamadas a SAP que puede provocar UN mensaje Kafka en el peor caso
    # (cabecera del BP + 4 features). RetryBudgetGuard comprueba al arrancar que
    # calls x (intentos x timeout + backoff) < max.poll.interval.ms (auditoria A10).
    calls-per-message: ${SAP_CLIENT_CALLS_PER_MESSAGE:5}
    retry:
      max-attempts: ${SAP_CLIENT_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${SAP_CLIENT_RETRY_INITIAL_BACKOFF_MS:500}
    circuit-breaker:
      failure-rate-threshold: ${SAP_CLIENT_CB_FAILURE_RATE:50}
      sliding-window-size: ${SAP_CLIENT_CB_WINDOW:10}
      wait-duration-open-ms: ${SAP_CLIENT_CB_WAIT_OPEN_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      # Un valor por app (customer-app / article-app); antes era el mismo en las
      # dos y sus series se mezclaban (auditoria A9).
      application: ${spring.application.name}
  # Trazas distribuidas (ADR-0009): starter oficial de OpenTelemetry de Boot 4.
  # Apagadas por defecto; con TRACING_ENABLED=true exportan por OTLP/HTTP al
  # colector o Tempo indicado y el traceId aparece en los logs (ECS).
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      export:
        enabled: ${TRACING_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        enabled: false   # las metricas las recoge Prometheus por scraping

server:
  # Parada ordenada: se dejan terminar las peticiones y los mensajes en curso
  # (hasta timeout-per-shutdown-phase) antes de cerrar (auditoria A10).
  shutdown: graceful

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # https://<keycloak>/realms/<realm>. Obligatorio con app.security.enabled=true.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  kafka:
    consumer:
      properties:
        # 15 min: por encima del presupuesto de reintentos por mensaje (5,1 min con
        # los defaults del cliente SAP). Con los 5 min por defecto de Kafka un SAP
        # degradado provocaba rebalanceos en cascada (auditoria A10).
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:900000}
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      auto-index-creation: true
