<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Customer · <th:block th:text="${entityId != null} ? ${entityId} : 'buscar'">titulo</th:block></title>
    <style th:inline="text">
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; background: #f6f7f9; color: #1d2226; }
        header { background: #1d2226; color: white; padding: 12px 16px; display: flex; align-items: center; gap: 16px; }
        header strong { font-size: 18px; }
        header nav a { color: #cbd3da; margin-right: 12px; text-decoration: none; }
        header nav a.active { color: white; font-weight: 600; }
        main { padding: 16px; max-width: 1100px; margin: 0 auto; }
        .tabs { display: flex; gap: 12px; border-bottom: 1px solid #d0d4da; margin-bottom: 16px; }
        .tabs a { padding: 8px 12px; text-decoration: none; color: #3656c9; border-bottom: 3px solid transparent; }
        .tabs a.active { border-bottom-color: #3656c9; font-weight: 600; }
        .card { background: white; padding: 16px; border-radius: 6px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
        table { width: 100%; border-collapse: collapse; }
        table td, table th { padding: 6px 8px; text-align: left; border-bottom: 1px solid #e2e5e9; font-size: 14px; }
        .muted { color: #6b7076; font-size: 13px; }
        .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: #eef0f3; font-size: 12px; margin-right: 4px; }
        .pill.ok { background: #d9f3df; color: #135e2c; }
        .pill.warn { background: #fbe7c2; color: #81560a; }
        .pill.error { background: #fbd5d5; color: #8c1d1d; }
        .badge-mask { background: #ffefc1; color: #81560a; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        code { background: #f0f2f5; padding: 1px 4px; border-radius: 4px; font-size: 13px; }
        .form-row { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type=text] { padding: 8px; border: 1px solid #cbd3da; border-radius: 4px; min-width: 280px; }
        button { background: #3656c9; color: white; padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; }
        form.inline { display: inline; }
    </style>
</head>
<body>
<header>
    <strong>dashboard-customer</strong>
    <nav>
        <a href="/customers/search" th:classappend="${currentPath != null and currentPath.startsWith('/customers/search')} ? 'active' : ''">Buscar</a>
        <a href="/customers/alerts/open" th:classappend="${currentPath != null and currentPath.startsWith('/customers/alerts')} ? 'active' : ''">Alertas</a>
    </nav>
    <span style="margin-left:auto" th:if="${piiMasked}" class="badge-mask">PII enmascarada (sap-external-read)</span>
</header>
<main>
    <th:block th:replace="${content}">Contenido</th:block>
</main>
</body>
</html>
