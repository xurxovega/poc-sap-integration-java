<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main>
    <nav class="tabs">
        <a th:href="@{|/customers/${entityId}|}">Resumen</a>
        <a class="active" th:href="@{|/customers/${entityId}/history|}">Histórico</a>
        <a th:href="@{|/customers/${entityId}/history/diff|}">Diff</a>
        <a th:href="@{|/customers/${entityId}/state|}">Estado</a>
    </nav>

    <div class="card">
        <h2>Histórico de <code th:text="${entityId}">id</code></h2>
        <p class="muted">Versiones indexadas en Elasticsearch, de más reciente a más antigua.</p>
        <table>
            <thead><tr><th>Hash</th><th>Instante</th><th>Nombre</th><th>Código</th></tr></thead>
            <tbody>
            <tr th:each="v : ${versions}">
                <td><code th:text="${v.payloadHash()}">hash</code></td>
                <td class="muted" th:text="${v.timestamp()}">ts</td>
                <td th:text="${v.snapshot() != null ? v.snapshot().name() : ''}">n</td>
                <td th:text="${v.snapshot() != null ? v.snapshot().code() : ''}">code</td>
            </tr>
            <tr th:if="${versions == null or #lists.isEmpty(versions)}">
                <td colspan="4" class="muted">No hay versiones indexadas para este cliente.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
