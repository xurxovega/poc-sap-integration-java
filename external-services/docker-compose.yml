# Imagenes fijadas por digest (plan Fase 8, auditoria A22): la etiqueta dice que
# version es; el digest garantiza que es exactamente la misma imagen en todos los
# equipos y en CI. Para actualizar una: docker pull <img>:<tag> && docker images
# --digests, y sustituir el sha256.
# Infraestructura externa para ejecutar poc-sap-integration-java en local.
# Servicios: Redpanda (broker Kafka-compatible), PostgreSQL, SQL Server,
# MongoDB, Elasticsearch/Kibana, MinIO (S3).
#
# Uso:
#   cd external-services
#   docker compose up -d
#   docker compose down

networks:
  poc_sap:
    driver: bridge

services:

  # ---------------------------------------------------------------------------
  # Redpanda (broker Kafka-compatible, sin ZooKeeper, wire Kafka 3.x)
  # OPS-010: sustituye al stack Kafka+Zookeeper previo.
  # Imagen: docker.redpanda.com/redpandadata/redpanda:v25.3.9
  #   - En local el digest lo fija el usuario tras `docker pull` + `docker
  #     images --digests` (politica del repo, auditoria A22). Mientras tanto
  #     se commitea con el tag v25.3.9 y un TODO para el digest.
  # Formato de listeners moderno (NO el legacy PLAINTEXT://):
  #   --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
  #     * internal  → puerto 9092, accesible desde dentro de la red Docker
  #       (kafka-connect y las apps cliente).
  #     * external  → puerto 19092, el que el host usa (advertised como
  #       localhost:19092). Spring Kafka conecta a localhost:19092 desde el host.
  #   --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
  # PandaProxy NO se declara: 8080 es Redpanda Console y el proxy legacy vive
  # en 8082 (verificado, no lo usamos).
  # ---------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.9
    container_name: redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --check=false
      - --node-id=0
      - --mode=dev-container
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"   # external Kafka (host). NO 9092 → 9092.
      - "9644:9644"     # Admin API
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Topologia de topics como codigo (ADR-0011). Redpanda auto-crea con 1
  # particion por defecto, lo que impide escalar a mas de un consumidor y
  # hace que el orden global de hoy sea accidental. Aqui se crean
  # explicitamente outbox.<DOMINIO> y su -dlt con 12 particiones: el DLT
  # recibe el registro en LA MISMA particion que el original, asi que
  # necesita al menos las mismas o la publicacion falla. 12 = 2 clusters x 2
  # instancias x concurrency 3, y divide entre 1,2,3,4,6,12. En produccion NO
  # crea los topics la app: ver deploy/README.md.
  # Herramienta: `rpk` (NO `kafka-topics`).
  # ---------------------------------------------------------------------------
  redpanda-init-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.9
    container_name: redpanda-init-topics
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "set -e
       for t in outbox.CUSTOMER outbox.CUSTOMER-dlt outbox.ARTICLE outbox.ARTICLE-dlt; do
         rpk topic create $$t --partitions $${KAFKA_TOPIC_PARTITIONS:-12} -r 1 || true
       done
       rpk topic list"
    restart: "no"
    networks:
      - poc_sap

  # ---------------------------------------------------------------------------
  # Kafka Connect (Debezium) — CDC de las tablas outbox legacy → topics outbox.*
  # Registro de conectores: ver external-services/debezium/README.md
  # OPS-010: BOOTSTRAP_SERVERS pasa a `redpanda:9092` (puerto internal).
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: debezium/connect:2.7.3.Final@sha256:997b67feff614549acd20d54bfed398fc73b339881c649d42821c1e55ec9972b
    container_name: kafka-connect
    depends_on:
      redpanda:
        condition: service_healthy
      sqlserver-source:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: poc-sap-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - poc_sap

  # ---------------------------------------------------------------------------
  # PostgreSQL — legacy source para el dominio ARTICLE
  # ---------------------------------------------------------------------------
  postgres-source:
    image: postgres:16@sha256:78df81b1442dcc764c1104154da7162635e40cfffe67579c42a1c1b96dfc209c
    container_name: postgres-source
    environment:
      POSTGRES_DB: poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d poc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # SQL Server — legacy source para el dominio CUSTOMER
  # ---------------------------------------------------------------------------
  sqlserver-source:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:0ec7739e1c5ec2f57861facbe1f2b74f1d3e147c7c97edf91eeea920c5944d9c
    container_name: sqlserver-source
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'SqlServer_Pa55w0rd!'
      MSSQL_PID: 'Developer'
      MSSQL_TCP_PORT: 1433
      # SQL Server Agent es obligatorio para los jobs de captura CDC (Debezium)
      MSSQL_AGENT_ENABLED: 'true'
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./sqlserver/init.sql:/init.sql:ro
    networks:
      - poc_sap
    healthcheck:
      # Segun el digest de 2022-latest, sqlcmd vive en mssql-tools18 (con -C) o
      # en mssql-tools (legacy): se prueban ambos. start_period amplio: el
      # primer arranque puede tardar >10 min (upgrade interno de msdb).
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SqlServer_Pa55w0rd!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'SqlServer_Pa55w0rd!' -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:0ec7739e1c5ec2f57861facbe1f2b74f1d3e147c7c97edf91eeea920c5944d9c
    container_name: sqlserver-init
    depends_on:
      sqlserver-source:
        condition: service_healthy
    volumes:
      - ./sqlserver/init.sql:/init.sql:ro
    networks:
      - poc_sap
    entrypoint: >
      /bin/bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver-source -U sa -P 'SqlServer_Pa55w0rd!' -C -i /init.sql ||
      /opt/mssql-tools/bin/sqlcmd -S sqlserver-source -U sa -P 'SqlServer_Pa55w0rd!' -i /init.sql
      "
    restart: "no"

  # ---------------------------------------------------------------------------
  # MongoDB — imagen actual + estado de sincronización
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0@sha256:81ed620b45935fb49704010b75d3fa73df547f71323cfdba49323a64412253a4
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: sap_integration
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # ELK — Elasticsearch + Kibana (Logstash omitido por simplicidad local)
  #
  # La version DEBE ir alineada con el cliente que trae Spring Boot 4.0
  # (elasticsearch-java 9.x via spring-data-elasticsearch 6.x): el cliente 9
  # manda 'application/vnd.elasticsearch+json;compatible-with=9' y un servidor 8
  # lo rechaza con media_type_header_exception, rompiendo indexacion y health.
  # ---------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1@sha256:43ea348fb0ae21f8610b1d144dfd165ee4045537bcdba3789ad0e5107533415c
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.1@sha256:7a68229de6555baec927c0680ca377a56fddb0e3ff9bef0eb804c4f374449960
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # MySQL — registro de features SDD (NO es una BD de la aplicacion)
  # Informacion ampliada de cada feature solicitada y su ciclo de vida.
  # Ningun modulo del reactor se conecta aqui: es el registro del trabajo.
  # ---------------------------------------------------------------------------
  mysql-sdd:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    container_name: mysql-sdd
    environment:
      MYSQL_ROOT_PASSWORD: sdd_root
      MYSQL_DATABASE: sdd_registry
      MYSQL_USER: sdd
      MYSQL_PASSWORD: sdd
    ports:
      - "3306:3306"
    volumes:
      - mysql_sdd_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible para almacenamiento de objetos (futuro)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z@sha256:5db7e40b69f0c3ad5a878521ff5029468e3070ef146c084dc2540e2d492075c4
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - poc_sap
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  minio-init:
    # minio/mc tiene sus propias releases (no coinciden con las de minio/minio)
    image: minio/mc:RELEASE.2024-07-26T13-08-44Z@sha256:a8c51dd4a53d46d1c3693106134f714b6c78dfe70469f8312b789d19826fe8d5
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/sap-integration &&
      mc anonymous set public local/sap-integration
      "
    networks:
      - poc_sap
    restart: "no"

volumes:
  postgres_data:
  mysql_sdd_data:
  sqlserver_data:
  mongo_data:
  elastic_data:
  minio_data:
  redpanda_data:
